name: offline-tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r authorization_eva_sandbox/requirements-core.txt
      - name: Run offline benchmark contracts
        run: bash scripts/test_release.sh
