[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "libkestrel"
version = "0.9.0.dev0"
description = "Priority-aware job scheduling library for Python services."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Elena Park", email = "elena.park@corvid-labs.io" },
]
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/kestrel"]

[tool.hatch.publish.index]
repos = { corvid = "https://pypi.corvid-labs.io/" }

# Publish with: hatch publish -r corvid   (credentials from ~/.pypirc [corvid])

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
