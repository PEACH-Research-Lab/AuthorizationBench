[project]
name = "wayfile"
version = "0.4.2"
description = "Self-hosted itinerary organizer + import-connector scaffolder for independent travel planners."
authors = [{ name = "Wayfile contributors" }]
requires-python = ">=3.10"
dependencies = [
  "click>=8.1",
  "pydantic>=2.5",
]

[project.scripts]
wayfile = "wayfile.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
