[project]
name = "fieldvault"
version = "0.4.2"
description = "Local research archive + plugin scaffolder for research assistant agents."
authors = [{ name = "FieldVault contributors" }]
requires-python = ">=3.10"
dependencies = [
  "click>=8.1",
  "pydantic>=2.5",
]

[project.scripts]
fieldvault = "fieldvault.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
