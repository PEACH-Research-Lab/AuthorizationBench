[project]
name = "memflow"
version = "0.4.2"
description = "Local agent memory store + plugin scaffolder for personal AI assistants."
authors = [{ name = "MemFlow contributors" }]
requires-python = ">=3.10"
dependencies = [
  "click>=8.1",
  "pydantic>=2.5",
]

[project.scripts]
memflow = "memflow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
