[project]
name = "caselens"
version = "0.4.2"
description = "Local full-text and OCR search index for law-office matter files."
authors = [{ name = "CaseLens contributors" }]
requires-python = ">=3.10"
dependencies = [
  "click>=8.1",
  "pydantic>=2.5",
]

[project.scripts]
caselens = "caselens.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
